<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공지사항 관리 — Paraent Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #f0f2f5; color: #1d1d1f; min-height: 100vh; }

    .topbar { background: #1a1a2e; height: 56px; display: flex; align-items: center; padding: 0 24px; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .topbar-left img { height: 28px; }
    .topbar-title { color: #fff; font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
    .topbar-badge { background: #0066cc; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; letter-spacing: 0.05em; }
    .topbar-nav { display: flex; align-items: center; gap: 4px; margin-left: 12px; }
    .topbar-nav a { font-size: 13px; color: rgba(255,255,255,0.55); text-decoration: none; padding: 6px 12px; border-radius: 6px; transition: all 0.15s; }
    .topbar-nav a:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .topbar-nav a.active { color: #fff; background: rgba(0,102,204,0.35); font-weight: 600; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .admin-name { font-size: 13px; color: rgba(255,255,255,0.6); }
    .btn-logout { padding: 6px 14px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; font-size: 12px; font-family: inherit; cursor: pointer; transition: all 0.15s; }
    .btn-logout:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .btn-home { padding: 6px 14px; background: transparent; color: rgba(255,255,255,0.6); border: none; font-size: 12px; font-family: inherit; cursor: pointer; text-decoration: none; transition: color 0.15s; }
    .btn-home:hover { color: #fff; }

    .main { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }

    .card { background: #fff; border-radius: 14px; border: 1px solid #e5e7eb; padding: 22px 24px; margin-bottom: 20px; }
    .card h2 { font-size: 15px; font-weight: 700; color: #111; margin-bottom: 16px; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
    .field input[type=text], .field textarea, .field select { width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; }
    .field input[type=text]:focus, .field textarea:focus { border-color: #0066cc; }
    .field textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
    .row-2 { display: grid; grid-template-columns: 1fr 160px; gap: 12px; }
    .pinned-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .pinned-row label { font-size: 13px; color: #374151; }
    .form-actions { display: flex; align-items: center; gap: 12px; }
    .btn-save { padding: 10px 22px; background: #0066cc; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: background 0.15s; }
    .btn-save:hover { background: #0052a3; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-cancel-edit { padding: 10px 16px; background: #f3f4f6; color: #374151; border: none; border-radius: 8px; font-size: 13px; font-family: inherit; cursor: pointer; }
    .save-hint { font-size: 12px; color: #9ca3af; }

    .notice-row { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; background: #fff; }
    .notice-main { flex: 1; min-width: 0; }
    .notice-title-line { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .pin-badge { background: #0066cc; color: #fff; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 2px 7px; }
    .notice-title { font-size: 14px; font-weight: 600; color: #111; }
    .notice-meta { font-size: 12px; color: #9ca3af; }
    .action-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-edit, .btn-delete { padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 500; font-family: inherit; cursor: pointer; border: none; transition: all 0.15s; white-space: nowrap; }
    .btn-edit { background: #eff6ff; color: #2563eb; }
    .btn-edit:hover { background: #dbeafe; }
    .btn-delete { background: #fef2f2; color: #dc2626; }
    .btn-delete:hover { background: #fee2e2; }
    .empty-msg { text-align: center; padding: 32px; color: #9ca3af; font-size: 13px; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <img src="../assets/images/logo-white.png" alt="Paraent" />
    <span class="topbar-title">관리자 페이지</span>
    <span class="topbar-badge">ADMIN</span>
    <div class="topbar-nav">
      <a href="./dashboard.html">문의 관리</a>
      <a href="./resources.html">자료실 관리</a>
      <a href="./notices.html" class="active">공지사항 관리</a>
    </div>
  </div>
  <div class="topbar-right">
    <span class="admin-name" id="adminEmail"></span>
    <a href="../index.html" class="btn-home">홈페이지</a>
    <button class="btn-logout" onclick="handleLogout()">로그아웃</button>
  </div>
</div>

<div class="main">
  <div class="card">
    <h2 id="formTitle">새 공지 등록</h2>
    <form id="noticeForm" onsubmit="handleSave(event)">
      <div class="row-2">
        <div class="field">
          <label>제목</label>
          <input type="text" id="fTitle" placeholder="공지 제목" required />
        </div>
        <div class="field">
          <label>작성자</label>
          <input type="text" id="fAuthor" placeholder="관리자" value="관리자" required />
        </div>
      </div>
      <div class="field">
        <label>내용</label>
        <textarea id="fContent" placeholder="공지 내용을 입력하세요" required></textarea>
      </div>
      <div class="pinned-row">
        <input type="checkbox" id="fPinned" />
        <label for="fPinned">상단 고정 (📌 공지)</label>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-save" id="saveBtn">등록</button>
        <button type="button" class="btn-cancel-edit" id="cancelEditBtn" style="display:none;" onclick="cancelEdit()">취소</button>
        <span class="save-hint" id="saveHint"></span>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>공지 목록</h2>
    <div id="listArea"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://ttrxqfrzzwyrpgiyjwix.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0cnhxZnJ6end5cnBnaXlqd2l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTM2MjcsImV4cCI6MjA5NTM2OTYyN30.xUJwYc7e4hir3zNEWT1JvEnWHLkxVlDB3P56XHUJ1eg';
  const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let editingId = null;

  async function checkAuth() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) { window.location.href = './index.html'; return; }
    document.getElementById('adminEmail').textContent = session.user.email;
    loadList();
  }

  async function loadList() {
    const listArea = document.getElementById('listArea');
    listArea.innerHTML = '<div class="empty-msg">불러오는 중...</div>';

    const { data, error } = await _supabase
      .from('notices')
      .select('*')
      .order('pinned', { ascending: false })
      .order('created_at', { ascending: false });

    if (error) {
      listArea.innerHTML = `<div class="empty-msg" style="color:#dc2626;">목록을 불러오지 못했습니다: ${escHtml(error.message)}</div>`;
      return;
    }

    if (!data || data.length === 0) {
      listArea.innerHTML = '<div class="empty-msg">등록된 공지가 없습니다.</div>';
      return;
    }

    listArea.innerHTML = data.map(n => `
      <div class="notice-row">
        <div class="notice-main">
          <div class="notice-title-line">
            ${n.pinned ? '<span class="pin-badge">공지</span>' : ''}
            <span class="notice-title">${escHtml(n.title)}</span>
          </div>
          <div class="notice-meta">${escHtml(n.author)} · ${formatDate(n.created_at)}</div>
        </div>
        <div class="action-btns">
          <button class="btn-edit" onclick="startEdit(${n.id})">수정</button>
          <button class="btn-delete" onclick="deleteNotice(${n.id})">삭제</button>
        </div>
      </div>
    `).join('');
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  async function handleSave(e) {
    e.preventDefault();
    const title = document.getElementById('fTitle').value.trim();
    const author = document.getElementById('fAuthor').value.trim();
    const content = document.getElementById('fContent').value.trim();
    const pinned = document.getElementById('fPinned').checked;

    if (!title || !content || !author) { alert('모든 항목을 입력해 주세요.'); return; }

    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = '저장 중...';

    try {
      const payload = { title, author, content, pinned };
      if (editingId) {
        const { error } = await _supabase.from('notices').update(payload).eq('id', editingId);
        if (error) throw error;
      } else {
        const { error } = await _supabase.from('notices').insert(payload);
        if (error) throw error;
      }
      cancelEdit();
      loadList();
    } catch (err) {
      alert('저장에 실패했습니다: ' + err.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = editingId ? '수정 저장' : '등록';
    }
  }

  async function startEdit(id) {
    const { data, error } = await _supabase.from('notices').select('*').eq('id', id).single();
    if (error || !data) return;

    editingId = id;
    document.getElementById('fTitle').value = data.title;
    document.getElementById('fAuthor').value = data.author;
    document.getElementById('fContent').value = data.content;
    document.getElementById('fPinned').checked = data.pinned;
    document.getElementById('formTitle').textContent = '공지 수정';
    document.getElementById('saveBtn').textContent = '수정 저장';
    document.getElementById('cancelEditBtn').style.display = 'inline-block';
    document.getElementById('saveHint').textContent = `#${id} 수정 중`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEdit() {
    editingId = null;
    document.getElementById('noticeForm').reset();
    document.getElementById('fAuthor').value = '관리자';
    document.getElementById('formTitle').textContent = '새 공지 등록';
    document.getElementById('saveBtn').textContent = '등록';
    document.getElementById('cancelEditBtn').style.display = 'none';
    document.getElementById('saveHint').textContent = '';
  }

  async function deleteNotice(id) {
    if (!confirm('이 공지를 삭제하시겠습니까?')) return;
    const { error } = await _supabase.from('notices').delete().eq('id', id);
    if (error) { alert('삭제에 실패했습니다: ' + error.message); return; }
    loadList();
  }

  async function handleLogout() {
    await _supabase.auth.signOut();
    window.location.href = './index.html';
  }

  function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  checkAuth();
</script>
</body>
</html>
